name: build-audio
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: restore previous progress
        uses: actions/cache/restore@v4
        with:
          path: out
          key: audio-${{ matrix.shard }}-v1
      - run: python gen_audio.py --shard ${{ matrix.shard }} --of 8 --out out
      - name: save progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: out
          key: audio-${{ matrix.shard }}-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.shard }}
          path: out
          retention-days: 1
  deploy:
    needs: gen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - run: |
          mkdir -p _site/a
          cp parts/*/*.mp3 _site/a/
          echo ok > _site/a/ok.txt
          ls _site/a | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
